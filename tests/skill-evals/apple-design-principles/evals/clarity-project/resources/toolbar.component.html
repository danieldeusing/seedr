<!-- Fleet console: toolbar of the vehicle list. The project uses the Clarity design system. -->
<div class="clr-row toolbar">
  <button class="btn btn-sm btn-link" style="height:20px;padding:0 2px" (click)="refresh()">Refresh</button>
  <button class="btn btn-sm btn-link" style="height:20px;padding:0 2px" (click)="deleteSelected()">DELETE ALL SELECTED VEHICLES NOW</button>
</div>
