<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Tab bar</title>
<!-- Mock of an iPhone app screen. Frame 393 x 852 pt; 1 CSS px = 1 pt. -->
<style>
body{margin:0;background:#ddd;font:17px -apple-system,system-ui,sans-serif}
.screen{width:393px;height:852px;margin:0 auto;background:#fff;position:relative;overflow:hidden}
.content{padding:80px 16px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;display:flex;border-top:1px solid #c6c6c8;background:#f9f9f9}
.tabbar button{flex:1;border:0;background:none;font-size:9px;padding:6px 0 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#8e8e93}
.tabbar button[aria-selected=true]{color:#007aff}
.tabbar i{font-style:normal;font-size:20px}
</style>
</head>
<body>
<div class="screen">
  <div class="content"><h1>Inbox</h1><p>12 unread messages</p></div>
  <div class="tabbar" role="tablist">
    <button role="tab" aria-selected="true"><i>&#9993;</i>Inbox</button>
    <button role="tab"><i>&#9733;</i>Starred</button>
    <button role="tab"><i>&#128196;</i>Drafts</button>
    <button role="tab" onclick="composeNewMessage()"><i>&#9998;</i>Compose</button>
    <button role="tab" onclick="deleteSelectedMessages()"><i>&#128465;</i>Delete</button>
    <button role="tab"><i>&#128193;</i>Folders</button>
    <button role="tab"><i>&#9881;</i>Settings</button>
  </div>
</div>
</body>
</html>
