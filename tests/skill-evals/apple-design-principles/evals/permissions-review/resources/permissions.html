<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>First launch</title>
<!-- Mock of an iPhone app screen. Frame 393 x 852 pt; 1 CSS px = 1 pt. -->
<style>
body{margin:0;background:#ddd;font:17px -apple-system,system-ui,sans-serif}
.screen{width:393px;height:852px;margin:0 auto;background:#fff;position:relative;overflow:hidden}
.splash{padding:200px 24px 0;text-align:center}
.alert{position:absolute;left:61px;width:270px;background:#f2f2f7;border-radius:14px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.alert h2{font-size:17px;margin:19px 16px 4px}
.alert p{font-size:13px;margin:0 16px 19px}
.alert .b{display:flex;border-top:1px solid #c6c6c8}
.alert button{flex:1;height:44px;border:0;background:none;color:#007aff;font-size:17px}
</style>
<script>
// Recipe app "Pantry". This runs in application(_:didFinishLaunchingWithOptions:), before any screen shows.
const launchSequence = ['requestLocationAlways', 'requestNotifications', 'requestTracking', 'requestContacts'];
</script>
</head>
<body>
<div class="screen">
  <div class="splash"><h1>Pantry</h1><p>Recipes for what you have at home</p></div>
  <div class="alert" style="top:300px" data-step="1">
    <h2>Allow “Pantry” to use your location?</h2>
    <p>We need your location.</p>
    <div class="b"><button>Don’t Allow</button><button>Always Allow</button></div>
  </div>
  <div class="alert" style="top:470px" data-step="3">
    <h2>Allow “Pantry” to track your activity across other companies’ apps and websites?</h2>
    <p>For a better experience.</p>
    <div class="b"><button>Ask App Not to Track</button><button>Allow</button></div>
  </div>
</div>
</body>
</html>
