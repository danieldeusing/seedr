# Production promotion. Runs on every push to `prod` and on manual dispatch, and does
# nothing until the exact commit has passed the shared validation pipeline.
#
# Release design (CLI):
#   1. decide whether a publish is needed and which version;
#   2. COMMIT the version bump and TAG it, and push both to `prod` — if that push is
#      rejected (someone moved prod), the job fails and nothing is published;
#   3. build from that committed tree and `npm publish --provenance`, so the provenance
#      attestation points at a commit that really contains the published version;
#   4. best-effort: carry the bump commit to `main`.
# A failed post-publish push can therefore no longer leave an npm artifact whose
# source never existed in Git: the source commit is on `prod` and tagged before step 3.
name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions: {}

# Serialised with the registry sync: releases and sync promotions never interleave.
concurrency:
  group: production-promotion
  cancel-in-progress: false

env:
  # Trusted publishing (OIDC provenance) needs npm >= 11.5.1; Node 22 ships npm 10.
  NPM_VERSION: 11.19.0

jobs:
  validate:
    name: Validate the commit being promoted
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  deploy-web:
    name: Deploy Web to Cloudflare Pages
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `--branch` is not optional here. The workflow checks out a commit, so
        # git is on a detached HEAD, and wrangler infers the deployment branch as
        # "head" — a *preview* branch. The upload succeeds, the job goes green, and
        # the custom domain keeps serving the last production deployment. Naming
        # the project's production branch is what makes this a production deploy.
        # wrangler lives in apps/web, so both commands run from there.
        working-directory: apps/web
        run: |
          pnpm exec wrangler pages project create seedr --production-branch=prod 2>/dev/null || true
          pnpm exec wrangler pages deploy --commit-dirty=true --branch=prod

  publish-cli:
    name: Publish CLI to npm
    needs: deploy-web # Only publish after the web deploy succeeded
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # version bump commit + tag
      id-token: write # npm provenance (OIDC trusted publishing)

    steps:
      - name: Checkout prod
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: prod
          fetch-depth: 0 # change detection walks history

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Pin npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decide whether to publish
        id: changes
        run: |
          NPM_VERSION_PUBLISHED=$(npm view @danieldeusing/seedr version 2>/dev/null || echo "0.0.0")
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")

          GT=$(node -e '
            const [a, b] = process.argv.slice(1);
            const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
            let gt = false;
            for (let i = 0; i < 3; i++) {
              if ((pa[i] || 0) > (pb[i] || 0)) { gt = true; break; }
              if ((pa[i] || 0) < (pb[i] || 0)) break;
            }
            process.stdout.write(gt ? "1" : "0");
          ' "$PACKAGE_VERSION" "$NPM_VERSION_PUBLISHED")

          if [ "$GT" = "1" ]; then
            echo "Version manually bumped ahead of npm ($PACKAGE_VERSION > $NPM_VERSION_PUBLISHED)"
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_VERSION_COMMIT=$(git log -1 --format="%H" -- packages/cli/package.json)
          CHANGED_FILES=$(git diff --name-only "$LAST_VERSION_COMMIT" HEAD -- packages/cli/ registry/ packages/shared/ 2>/dev/null || echo "")

          if [ -n "$CHANGED_FILES" ]; then
            echo "Changes since $LAST_VERSION_COMMIT:"
            echo "$CHANGED_FILES"
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CLI/registry/shared changes since the last version commit"
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "npm_version=$NPM_VERSION_PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push the version bump BEFORE publishing
        if: steps.changes.outputs.needs_bump == 'true'
        id: bump
        run: |
          cd packages/cli
          # Start from the published version so we never collide with or fall behind npm.
          npm version "${{ steps.changes.outputs.npm_version }}" --no-git-tag-version --allow-same-version
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json
          git commit -m "chore(cli): release $NEW_VERSION [skip ci]"
          git tag -a "cli-v$NEW_VERSION" -m "@danieldeusing/seedr $NEW_VERSION"
          # Non-fast-forward pushes are rejected: if prod moved, this fails and nothing is published.
          git push origin HEAD:prod
          git push origin "cli-v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the committed tree
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          git diff --quiet || { echo "::error::working tree is dirty before publish"; exit 1; }
          pnpm build

      - name: Publish to npm with provenance
        if: steps.changes.outputs.should_publish == 'true'
        working-directory: packages/cli
        run: npm publish --access public --provenance

      # Land the released version on main too, or main's CLI version goes stale and every
      # promotion of main into prod conflicts on packages/cli/package.json. That is not
      # hypothetical: this step existed before and never once worked, so prod reached 0.1.97
      # while main still said 0.1.89 — eight releases — and the promotion on 2026-09-01 hit
      # exactly that conflict.
      #
      # WHY IT NEVER WORKED: it ran `git rebase origin/main` while checked out on prod. That
      # does not replay the version bump onto main, it tries to replay EVERY prod commit main
      # does not have — a hundred-plus of them, including the registry commits the sync job
      # deliberately rebases onto prod as separate copies. It conflicted every time, hit
      # `rebase --abort`, emitted a warning nobody was reading, and the drift compounded.
      #
      # SET THE VERSION, DO NOT MOVE THE COMMIT. main and prod have diverged by construction,
      # so no cherry-pick of the bump commit applies cleanly either — its context is prod's
      # version, which main does not share. Writing the number straight into main's own
      # package.json cannot conflict, and it states the intent exactly: main should say what npm
      # published. `--allow-same-version` makes it idempotent if main is already correct.
      - name: Mirror the released CLI version onto main
        if: steps.changes.outputs.needs_bump == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git fetch origin main
          git checkout -B cli-version-mirror origin/main
          ( cd packages/cli && npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version )
          if git diff --quiet -- packages/cli/package.json; then
            echo "main already records $NEW_VERSION — nothing to mirror"
            exit 0
          fi
          git add packages/cli/package.json
          git commit -m "chore(cli): record release $NEW_VERSION on main [skip ci]"
          # One retry: main is a busy branch and may have moved between the fetch and the push.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main || { git rebase --abort; true; }
            git push origin HEAD:main || {
              echo "::error::could not record $NEW_VERSION on main. The release itself is fine — it is published, tagged cli-v$NEW_VERSION and live on prod — but main now understates the CLI version and the next promotion will conflict on packages/cli/package.json. Fix with: git checkout main && (cd packages/cli && npm version $NEW_VERSION --no-git-tag-version --allow-same-version) && git commit -am 'chore(cli): record release $NEW_VERSION on main' && git push"
              exit 0
            }
          fi
