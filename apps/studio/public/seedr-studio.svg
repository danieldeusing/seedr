<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The estate mark, with Studio's letter. Geometry, font stack, weight and
       cursor block are the estate favicon's (see configr's public/configr.svg,
       which documents the treatment); only the glyph differs. One variant, warm,
       exactly as cockpit and danieldeusing.de wear it — the mark brings its own
       opaque ground, so it does not need to match what it is placed on. -->
  <rect fill="#f5efe2" width="64" height="64"/>
  <text fill="#43352a" x="8" y="46" font-family="Menlo, 'JetBrains Mono', monospace" font-size="38" font-weight="700">S</text>
  <rect fill="#8a4516" x="38" y="18" width="14" height="30"/>
</svg>
