packages:
  - "packages/*"
  - "apps/*"

# pnpm 10 reads settings from this file; the package.json `pnpm` field is ignored.
overrides:
  "rollup": ">=4.59.0"
  "minimatch": ">=10.2.3"
  "@isaacs/brace-expansion@<=5.0.0": ">=5.0.1"
  "ajv@<6.14.0": ">=6.14.0"
  "esbuild@<0.28.1": ">=0.28.1"
  "postcss@<8.5.10": ">=8.5.10"
  "flatted@<3.4.2": ">=3.4.2"
  "picomatch@>=2.0.0 <2.3.2": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  "brace-expansion@>=5.0.0 <5.0.6": ">=5.0.6"
  "yaml@<2.8.3": ">=2.8.3"
peerDependencyRules:
  allowAny:
    - "eslint"
