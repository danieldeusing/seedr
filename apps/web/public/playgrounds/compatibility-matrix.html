<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedr Compatibility Matrix</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="vendor/tokens.css">
<link rel="stylesheet" href="vendor/base.css">
<link rel="stylesheet" href="vendor/components.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="compatibility-matrix.css">
</head>
<body>

<div class="header">
  <h1 class="glow">Compatibility Matrix</h1>
  <span>What works with what</span>
</div>

<div class="layout">
  <div class="controls">
    <div>
      <div class="section-label">View</div>
      <div class="view-tabs" id="viewTabs"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Highlight Type</div>
      <div class="type-chips" id="typeChips"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Highlight Tool</div>
      <div class="tool-chips" id="toolChips"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Presets</div>
      <div class="presets" id="presets"></div>
    </div>
  </div>

  <div class="preview">
    <div id="mainContent"></div>
    <div class="prompt-bar">
      <div class="prompt-text" id="promptText"></div>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
  </div>
</div>

<script src="compatibility-matrix.js" defer></script>
</body>
</html>
