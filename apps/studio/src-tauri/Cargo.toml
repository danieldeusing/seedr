[package]
name = "seedr-studio"
version = "0.1.0"
description = "Seedr Studio — a desktop capability manager for a seedr registry"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "seedr_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# The host is a deliberately small, root-scoped filesystem bridge plus a watcher.
# Registry semantics live in TypeScript (@seedr/registry-ops); nothing here
# knows what an item is.
# Already in the graph through tauri; declared here for `~/.claude/skills`, which
# is the one path the host reads outside the chosen repository.
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dependabot flags `glib 0.18.5` (RUSTSEC: Iterator unsoundness) reachable through
# tauri -> gtk 0.18 -> atk -> glib. It cannot be fixed here: `gtk` is unmaintained at
# 0.18.2 ("use gtk4 instead") and pins `glib ^0.18`, so glib >= 0.20 does not exist on
# that line. It clears when Tauri migrates off the gtk3 bindings. The path is also
# Linux-only (gtk/atk are Tauri's Linux backend) and Studio's own code never touches
# glib collections. Re-check when Tauri publishes past 2.11.5.
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-window-state = "2"
# scheme gate for open_external: parsing resolves what string-matching cannot
url = "2"

[target.'cfg(windows)'.dependencies]
# Job Object with kill-on-close: the only way to end a whole process tree on
# Windows, where process groups do not exist (plan §6.2, trap 15).
win32job = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
