packages:
  - "packages/*"
  - "apps/*"

# pnpm 10 reads settings from this file; the package.json `pnpm` field is ignored.
overrides:
  "rollup": ">=4.59.0"
  "minimatch": ">=10.2.3"
  "@isaacs/brace-expansion@<=5.0.0": ">=5.0.1"
  "ajv@<6.14.0": ">=6.14.0"
  "esbuild@<0.28.1": ">=0.28.1"
  "postcss@<8.5.23": ">=8.5.23"
  "flatted@<3.4.2": ">=3.4.2"
  "picomatch@>=2.0.0 <2.3.2": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  "brace-expansion@>=3.0.0 <5.0.7": ">=5.0.7"
  "yaml@<2.8.3": ">=2.8.3"
  "undici@<7.29.0": ">=7.29.0"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0"
  "sharp@<0.35.0": ">=0.35.0"
  "@babel/core@<7.29.6": ">=7.29.6"
peerDependencyRules:
  allowAny:
    - "eslint"

# Exempted from pnpm's minimum-release-age gate, which otherwise refuses a package published
# within the last few days — the window in which a compromised release is usually caught and
# pulled. @danieldeusing/design is OURS: same author, same machine, published shortly before it is
# consumed here, so the gate is measuring a risk that does not apply. Pinned to an EXACT version
# deliberately — this exempts THAT release, not the package forever, so the list is appended to as
# new ones are consumed. Same convention and same wording as apps/pagr.
minimumReleaseAgeExclude:
  - '@danieldeusing/design@0.52.0 || 0.53.0 || 0.54.0 || 0.55.0'
