# The single validation pipeline. CI, the registry sync and the production deploy
# all call this workflow, so what "validated" means cannot drift between them.
name: Validate

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch or SHA) to validate
        required: true
        type: string

permissions: {}

jobs:
  checks:
    name: Lint, typecheck, tests, build, registry, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: CLI unit tests with coverage thresholds
        run: pnpm --filter @danieldeusing/seedr test:coverage

      - name: Registry script tests
        run: pnpm test:scripts

      - name: Web unit and API tests
        run: pnpm --filter @seedr/web test

      - name: Studio webview tests
        run: pnpm --filter @seedr/studio test

      - name: Build
        run: pnpm build

      - name: Registry descriptions
        run: pnpm check-descriptions

      - name: Generated manifests are in sync with item.json sources
        run: |
          pnpm compile
          git diff --exit-code -- registry/ || {
            echo "::error::registry/*/manifest.json differ from the compiled output — run 'pnpm compile' and commit"
            exit 1
          }

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate

      - name: CLI package contents
        working-directory: packages/cli
        run: npm pack --dry-run --cache "$RUNNER_TEMP/npm-cache"

  browser:
    name: Browser tests (responsive, navigation, a11y, routing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @seedr/web exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm --filter @seedr/web build

      - name: Browser tests
        run: pnpm --filter @seedr/web test:e2e

  # The registry operations are the safety argument of Seedr Studio and must hold on
  # every OS a maintainer uses. `pnpm install` also runs scripts/setup-agents.mjs here,
  # so the Windows junction path is exercised on every push.
  registry-ops:
    name: Registry ops (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test registry ops
        run: pnpm --filter @seedr/registry-ops test

      - name: Test repo scripts
        run: pnpm test:scripts

      # The Studio host: path scoping, the process executor (tree kill, watchdog,
      # stream caps) and the source reader, on every OS.
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/studio/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/studio/src-tauri/Cargo.lock') }}

      - name: Test Studio host
        run: cargo test --manifest-path apps/studio/src-tauri/Cargo.toml
