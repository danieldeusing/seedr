<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedr Installation Path Visualizer</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="vendor/tokens.css">
<link rel="stylesheet" href="vendor/base.css">
<link rel="stylesheet" href="vendor/components.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="install-paths.css">
</head>
<body>

<div class="header">
  <h1>Installation Path Visualizer</h1>
  <span>Where does seedr put your files?</span>
</div>

<div class="layout">
  <div class="controls">
    <div>
      <div class="section-label">Content Type</div>
      <div class="type-chips" id="typeChips"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">AI Tools</div>
      <div class="check-group" id="toolChecks"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Scope</div>
      <div class="radio-group" id="scopeRadio"></div>
    </div>
    <div id="methodSection" hidden>
      <div class="section-label">Method</div>
      <div class="radio-group" id="methodRadio"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Presets</div>
      <div class="presets" id="presets"></div>
    </div>
  </div>

  <div class="preview">
    <div class="summary-card" id="summaryCard"></div>
    <div class="tree-section">
      <div class="tree-header">File System Layout</div>
      <div class="tree-content" id="fileTree"></div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot created"></div> Created</div>
      <div class="legend-item"><div class="legend-dot modified"></div> Modified</div>
      <div class="legend-item"><div class="legend-dot symlink"></div> Symlink</div>
      <div class="legend-item"><div class="legend-dot existing"></div> Existing</div>
    </div>
    <div class="prompt-bar">
      <div class="prompt-text" id="promptText"></div>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
  </div>
</div>

<script src="install-paths.js" defer></script>
</body>
</html>
