<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedr Registry Architecture</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="vendor/tokens.css">
<link rel="stylesheet" href="vendor/base.css">
<link rel="stylesheet" href="vendor/components.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="registry-architecture.css">
</head>
<body>

<div class="header">
  <h1>Registry Architecture</h1>
  <span>How seedr organizes and serves content</span>
</div>

<div class="layout">
  <div class="controls">
    <div>
      <div class="section-label">View</div>
      <div class="view-tabs" id="viewTabs"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Highlight Type</div>
      <div class="type-chips" id="typeChips"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Source Type</div>
      <div class="source-chips" id="sourceChips"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="toggle-row">
        <span class="toggle-label">Show JSON content</span>
        <div class="toggle" id="detailToggle"></div>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Presets</div>
      <div class="presets" id="presets"></div>
    </div>
  </div>

  <div class="preview">
    <div class="canvas" id="canvas"></div>
    <div class="prompt-bar">
      <div class="prompt-text" id="promptText"></div>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
  </div>
</div>

<script src="registry-architecture.js" defer></script>
</body>
</html>
