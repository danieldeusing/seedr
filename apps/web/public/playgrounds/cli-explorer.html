<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedr CLI Explorer</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="vendor/tokens.css">
<link rel="stylesheet" href="vendor/base.css">
<link rel="stylesheet" href="vendor/components.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="cli-explorer.css">
</head>
<body>

<div class="header">
  <h1 class="glow">Seedr CLI Explorer</h1>
  <span>Interactive command playground</span>
</div>

<div class="layout">
  <div class="controls">
    <div>
      <div class="section-label">Command</div>
      <div class="cmd-tabs" id="cmdTabs"></div>
    </div>
    <div class="divider"></div>
    <div id="optionsPanel"></div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Presets</div>
      <div class="presets" id="presets"></div>
    </div>
  </div>

  <div class="preview">
    <div class="cmd-bar">
      <div class="cmd-text" id="cmdText"></div>
      <button class="copy-btn" id="copyBtn" type="button">Copy</button>
    </div>
    <div id="dryRunBanner" class="dry-run-banner" hidden>
      <span>⚠</span> Dry run mode — no files will be created or modified
    </div>
    <div class="terminal">
      <div class="terminal-header">Terminal Output</div>
      <div class="term-content" id="termOutput"></div>
    </div>
    <div class="filetree">
      <div class="filetree-header">File System Effects</div>
      <div class="tree-content" id="fileTree"></div>
    </div>
  </div>
</div>

<script src="cli-explorer.js" defer></script>
</body>
</html>
