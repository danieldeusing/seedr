# Nightly registry sync. The sync commit is validated on a temporary branch BEFORE it
# is promoted: nothing reaches `main` (which every installed CLI reads the registry from)
# or `prod` (which deploys) without passing the same checks as CI.
name: Sync Registry

on:
  schedule:
    # Run daily at 6:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions: {}

# Serialised with the deploy workflow: a sync promotion and a release never interleave.
concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch upstream and stage a candidate commit
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the candidate branch
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      candidate: ${{ steps.changes.outputs.candidate }}
      new_items: ${{ steps.changes.outputs.new_items }}
      list: ${{ steps.changes.outputs.list }}
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync registry (fails closed on incomplete upstream data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync

      - name: Stage and describe changes
        id: changes
        run: |
          NEW_FILES=$(git ls-files --others --exclude-standard 'registry/*/*/item.json')
          if [ -n "$NEW_FILES" ]; then
            echo "new_items=true" >> "$GITHUB_OUTPUT"
            LIST=$(node -e '
              const fs = require("node:fs");
              const out = [];
              for (const f of process.argv.slice(1)) {
                const item = JSON.parse(fs.readFileSync(f, "utf8"));
                out.push(`- **${item.name}** (${item.type}: \`${item.slug}\`)`);
              }
              process.stdout.write(out.join("\n"));
            ' $NEW_FILES)
            {
              echo "list<<EOF"
              echo "$LIST"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "new_items=false" >> "$GITHUB_OUTPUT"
          fi

          git add registry/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No registry changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync registry from upstream sources"
          CANDIDATE="sync/${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$CANDIDATE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate the candidate
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.sync.outputs.candidate }}

  promote:
    name: Promote to main and prod
    needs: [sync, validate]
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch the deploy for prod (GITHUB_TOKEN pushes never trigger workflows)
    steps:
      - name: Checkout the validated candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.sync.outputs.candidate }}
          fetch-depth: 0

      - name: Fast-forward main to the validated commit
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main moved while the candidate was being validated; not promoting an unvalidated merge. Re-run the sync."
            exit 1
          fi
          git push origin HEAD:main

      - name: Apply the registry change to prod
        # prod usually lacks main's unreleased application commits, so the validated
        # registry commit is replayed on top of prod. The deploy workflow validates
        # that resulting commit again before anything is deployed or published.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin prod
          git rebase origin/prod
          git push origin HEAD:prod

      - name: Delete the candidate branch
        if: always()
        run: git push origin --delete "${{ needs.sync.outputs.candidate }}" || true

      - name: Deploy prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref prod

  notify:
    name: Email new items
    needs: [sync, promote]
    if: needs.sync.outputs.new_items == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send new items email
        uses: dawidd6/action-send-mail@6d98ae34d733f9a723a9e04e94f2f24ba05e1402 # v6.x
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Seedr Registry: New items detected"
          to: ${{ vars.NOTIFY_EMAIL || secrets.SMTP_USERNAME }}
          from: ${{ secrets.SMTP_USERNAME }}
          content_type: text/plain
          body: |
            New items were added to the seedr registry during today's sync:

            ${{ needs.sync.outputs.list }}

            View the registry: ${{ vars.SITE_URL || 'https://seedr.danieldeusing.de' }}
            Repository: ${{ github.server_url }}/${{ github.repository }}
