<svg viewBox="0 0 700 300" role="img" aria-labelledby="igTitle" xmlns="http://www.w3.org/2000/svg">
  <title id="igTitle">Example infrastructure, built up stage by stage</title>
  <defs><marker id="igA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>

  <!-- outside: appears in stage 1 -->
  <g data-s="1"><rect class="bx" x="40" y="20" width="160" height="56" rx="4"/><text class="t" x="52" y="44">DNS</text><text class="s" x="52" y="62">example.org</text></g>
  <path class="ln" data-s="1" d="M120 76V118" marker-end="url(#igA)"/>

  <!-- the estate: no data-s, so it is there from stage 0 -->
  <rect class="zone" x="20" y="120" width="440" height="160" rx="6"/>
  <text class="z" x="34" y="140">Data centre</text>
  <g><rect class="bx" x="40" y="160" width="180" height="100" rx="4"/><text class="m" x="52" y="184">app-1</text>
    <text class="s" data-u="1" x="52" y="204">reachable by IP only</text>
    <text class="s" data-s="1" x="52" y="204">answers on the domain</text></g>
  <g><rect class="bx" x="250" y="160" width="190" height="100" rx="4"/><text class="m" x="262" y="184">db-1</text><text class="s" x="262" y="204">PostgreSQL · nightly backup</text></g>
  <path class="ln" d="M220 210H248" marker-end="url(#igA)"/>

  <!-- appears in stage 2 -->
  <g data-s="2"><rect class="bx" x="500" y="160" width="180" height="100" rx="4"/><text class="t" x="512" y="184">Alerting</text><text class="s" x="512" y="204">outside the estate</text></g>
  <path class="ln" data-s="2" d="M440 230H498" marker-end="url(#igA)"/>
</svg>
