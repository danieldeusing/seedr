<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seedr Studio</title>
    <script>
      // Apply the stored theme before first paint. Same key name and values as the
      // rest of the estate, though the webview origin has its own localStorage —
      // the header's theme button is where the choice is made here.
      (() => {
        const themes = ["warm", "green", "mono", "paper"];
        let theme = "warm";
        try {
          const stored = localStorage.getItem("theme");
          if (stored && themes.includes(stored)) theme = stored;
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
