# Weekly dependency updates: minor and patch grouped into one PR per ecosystem,
# every major on its own PR. Nothing merges automatically.
# The private fork (seedr-internal) deletes this file after each upstream merge (see its ESTATE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
