<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Checkout</title>
<!-- Mock of an iPhone app screen. Frame 393 x 852 pt; 1 CSS px = 1 pt. -->
<style>
body{margin:0;background:#ddd;font:17px -apple-system,system-ui,sans-serif}
.screen{width:393px;height:852px;margin:0 auto;background:#fff;position:relative;overflow:hidden}
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-top:59px}
.icon-btn{width:30px;height:30px;border:0;background:none;font-size:18px;padding:0}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e5e5ea}
.qty button{width:24px;height:24px;border:1px solid #c7c7cc;border-radius:12px;background:#fff;padding:0}
.total{padding:16px;font-weight:600;display:flex;justify-content:space-between}
.pay{display:block;width:80px;height:24px;margin:8px auto;border:0;border-radius:4px;background:#1a7f37;color:#fff;font-size:11px}
.card{display:block;width:361px;height:50px;margin:12px 16px;border:0;border-radius:12px;background:#007aff;color:#fff;font-size:17px}
</style>
</head>
<body>
<div class="screen">
  <div class="nav">
    <button class="icon-btn" aria-label="Back">&#8249;</button>
    <strong>Checkout</strong>
    <button class="icon-btn" aria-label="Edit cart">&#9998;</button>
  </div>
  <div class="row"><span>Trail shoes, size 43</span>
    <span class="qty"><button aria-label="Fewer">&minus;</button> 1 <button aria-label="More">+</button></span></div>
  <div class="row"><span>Running socks, 3 pairs</span>
    <span class="qty"><button aria-label="Fewer">&minus;</button> 2 <button aria-label="More">+</button></span></div>
  <div class="total"><span>Total</span><span>$149.00</span></div>
  <button class="pay">Express checkout</button>
  <button class="card">Pay with card</button>
</div>
</body>
</html>
