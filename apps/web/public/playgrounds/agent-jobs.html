<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedr Agent Jobs</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="vendor/tokens.css">
<link rel="stylesheet" href="vendor/base.css">
<link rel="stylesheet" href="vendor/components.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="agent-jobs.css">
</head>
<body>

<div class="header">
  <h1 class="glow">Agent Jobs</h1>
  <span>What Seedr Studio lets a coding agent do, and how each CLI spells it</span>
</div>

<div class="layout">
  <div class="controls">
    <div>
      <div class="section-label">View</div>
      <div class="view-tabs" id="viewTabs"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Job</div>
      <div class="job-list" id="jobList"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Capabilities</div>
      <div class="cap-chips" id="capChips"></div>
      <div class="cap-hint" id="capHint"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-label">Coding Agent</div>
      <div class="tool-chips" id="toolChips"></div>
    </div>
  </div>

  <div class="preview">
    <div id="mainContent"></div>
    <div class="prompt-bar">
      <div class="prompt-text" id="promptText"></div>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
  </div>
</div>

<script src="agent-jobs.js" defer></script>
</body>
</html>
