<!DOCTYPE html>
<!-- `data-scale="fixed"` holds the root font at 1rem whatever the window's
     width. @danieldeusing/design scales it with the viewport by default, which is
     right for a page — a 4K browser window should get a bigger page, not 12px text
     in the middle of a panel. A window is not that: its width is something you drag
     on a display that never changed, and scaling to it grew Studio's own chrome
     while you were only trying to see more of it. Past a ~2500px-wide window the
     icon buttons were taller than the 36px bars holding them. -->
<html lang="en" data-scale="fixed">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seedr Studio</title>
    <script>
      // Apply the stored theme before first paint. Same key name and values as the
      // rest of the estate, though the webview origin has its own localStorage —
      // the header's theme button is where the choice is made here.
      (() => {
        const themes = ["warm", "green", "mono", "paper"];
        let theme = "warm";
        try {
          const stored = localStorage.getItem("theme");
          if (stored && themes.includes(stored)) theme = stored;
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
