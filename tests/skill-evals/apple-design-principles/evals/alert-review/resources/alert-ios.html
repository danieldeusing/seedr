<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Delete alert</title>
<!-- Mock of an iPhone app screen. Frame 393 x 852 pt; 1 CSS px = 1 pt. -->
<style>
body{margin:0;background:#ddd;font:17px -apple-system,system-ui,sans-serif}
.screen{width:393px;height:852px;margin:0 auto;background:#fff;position:relative;overflow:hidden}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.alert{position:absolute;left:61px;top:330px;width:270px;background:#f2f2f7;border-radius:14px;text-align:center}
.alert h2{font-size:17px;margin:19px 16px 4px}
.alert p{font-size:13px;margin:0 16px 19px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #c6c6c8}
.buttons button{height:44px;border:0;border-left:1px solid #c6c6c8;background:none;color:#007aff;font-size:13px;padding:0}
.buttons button:first-child{border-left:0}
.default{font-weight:600}
</style>
</head>
<body>
<div class="screen">
  <div class="dim"></div>
  <div class="alert" role="alertdialog" aria-labelledby="t">
    <h2 id="t">WARNING</h2>
    <p>Are you sure?</p>
    <div class="buttons">
      <!-- row order, leading to trailing -->
      <button class="default">Delete All</button>
      <button>Yes</button>
      <button>Archive</button>
      <button>Later</button>
    </div>
  </div>
</div>
</body>
</html>
